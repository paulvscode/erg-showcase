<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start a Session</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Racing+Sans+One&display=swap">
<style>
  :root {
    --bg: #000000; --panel: #111111; --line: #29282d; --text: #ffffff; --muted: #9a99a0;
    --red: #e30613; --gold: #c9a54e;
    --display: "Racing Sans One", "Arial Black", sans-serif;
    --body: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font-family: var(--body); }
  main { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; }
  h1 { font-size: 32px; }
  h2 { font-size: 20px; color: var(--muted); }
  .label { color: var(--muted); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; }
  .presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 10px; }
  .preset { background: var(--panel); border: 2px solid var(--line); padding: 12px 14px; cursor: pointer; text-align: left; color: var(--text); font: inherit; }
  .preset.on { border-color: var(--red); }
  .preset .name { font-family: var(--display); font-size: 20px; }
  .preset .type { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--red); }
  .preset ol { margin: 8px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; line-height: 1.4; }
  .preset .record { color: var(--gold); font-size: 13px; margin-top: 6px; }
  .preset .squad { margin: 6px 0; color: var(--muted); font-size: 13px; }
  .preset summary { font-size: 13px; cursor: pointer; padding: 3px 0; }
  .row { display: grid; grid-template-columns: 1fr 1.6fr .9fr; gap: 8px; align-items: center; background: var(--panel); padding: 10px 12px; border-left: 4px solid var(--red); }
  .row.offline { border-left-color: var(--line); }
  .row .machine { font-weight: 700; }
  .row .machine small { display: block; color: var(--muted); font-weight: 400; }
  input { width: 100%; min-width: 0; font-size: 16px; padding: 10px; background: #000; color: var(--text); border: 1px solid var(--line); }
  input:focus { outline: 2px solid var(--red); border-color: transparent; }
  .duration { display: flex; gap: 10px; align-items: center; }
  .duration input { width: 100px; }
  button.go { font-family: var(--display); font-size: 24px; color: var(--text); background: var(--red); border: 0; padding: 14px; cursor: pointer; }
  button.go:disabled { opacity: .5; cursor: default; }
  button.stop { background: var(--line); }
  #error { color: #ff6b6b; min-height: 1.2em; }
  .running { background: var(--panel); padding: 16px; border-left: 4px solid var(--red); display: flex; flex-direction: column; gap: 12px; }
  [hidden] { display: none !important; }
  @media (max-width: 520px) { .row { grid-template-columns: 1fr 1fr; } .row .machine { grid-column: 1 / -1; } }
</style>
<script src="static-demo.js"></script>
</head>
<body>
<main>
  <h1>Start a session</h1>

  <section class="running" id="running" hidden>
    <h2 id="running-text">A session is running.</h2>
    <button class="go stop" id="stop">Stop the session</button>
  </section>

  <form id="form">
    <div style="display:flex;flex-direction:column;gap:20px">
      <div>
        <div class="label">Session</div>
        <div class="presets" id="presets"></div>
      </div>
      <div class="duration" id="duration-box">
        <div class="label">Duration</div>
        <input type="number" id="duration" min="1" max="180" step="1"> <span>minutes</span>
      </div>
      <div>
        <div class="label">Who's on which machine? Leave a machine empty if nobody uses it.</div>
        <div id="riders" style="display:flex;flex-direction:column;gap:8px;margin-top:8px"></div>
      </div>
      <div id="error"></div>
      <button class="go" type="submit" id="start">Start ▶</button>
    </div>
  </form>
</main>

<script>
const $ = (id) => document.getElementById(id);
// The static showcase runs the server inside the page and provides ergBackend.
const api = (path, options) => (window.ergBackend ?? window).fetch(path, options);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const MACHINE = { bike: "BikeErg", row: "RowErg", ski: "SkiErg", run: "AssaultRunner" };
const clock = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const TYPE_LABEL = { training: "Training · ", blitz: "Blitz · max ", squad: "Squad · max " };
let presets = [];

// Each machine type has its own list; the group wins when every rider finishes theirs.
function squadSteps(p) {
  const lists = Object.entries(p.machines).map(([machine, steps]) => `
    <details><summary>${MACHINE[machine] ?? esc(machine)} · ${steps.length} objectives</summary>
      <ol>${steps.map((s) => `<li>${esc(s)}</li>`).join("")}</ol></details>`).join("");
  return `<p class="squad">Everyone completes their own objectives.</p>${lists}`;
}
let chosen = null;

function choose(id) {
  chosen = presets.find((p) => p.id === id);
  document.querySelectorAll(".preset").forEach((el) => el.classList.toggle("on", el.dataset.id === id));
  $("duration-box").hidden = chosen.type !== "training";
  $("duration").value = chosen.duration_min;
}

async function load() {
  const setup = await (await api("/api/session/setup")).json();
  presets = setup.presets;
  $("presets").innerHTML = presets.map((p) => `
    <div class="preset" role="button" tabindex="0" data-id="${esc(p.id)}">
      <div class="type">${TYPE_LABEL[p.type]}${p.duration_min} min</div>
      <div class="name">${esc(p.name)}</div>
      ${p.type === "squad" ? squadSteps(p) : `<ol>${p.steps.map((s) => `<li>${esc(s)}</li>`).join("")}</ol>`}
      ${p.record_s != null ? `<div class="record">Record ${clock(p.record_s)}</div>` : ""}
    </div>`).join("");
  $("riders").innerHTML = setup.ergs.map((e) => `
    <div class="row${e.online ? "" : " offline"}">
      <div class="machine">${MACHINE[e.machine] ?? esc(e.machine)}<small>${esc(e.id)}${e.online ? "" : " · offline"}</small></div>
      <input name="name" data-erg="${esc(e.id)}" placeholder="Name" maxlength="24" autocomplete="off">
      ${e.machine === "run"
        ? `<input name="weight" data-erg="${esc(e.id)}" type="number" min="30" max="250" placeholder="kg (optional)">`
        : "<span></span>"}
    </div>`).join("");
  if (presets.length) choose(presets[0].id);
  showRunning(setup.running);
}

function showRunning(running, text) {
  $("running").hidden = !running;
  $("form").hidden = running;
  if (text) $("running-text").textContent = text;
}

$("presets").addEventListener("click", (ev) => {
  const el = ev.target.closest(".preset");
  if (el) choose(el.dataset.id);
});
$("presets").addEventListener("keydown", (ev) => {
  const el = ev.target.closest(".preset");
  if (el && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); choose(el.dataset.id); }
});

$("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const weights = {};
  document.querySelectorAll('input[name="weight"]').forEach((i) => { if (i.value) weights[i.dataset.erg] = Number(i.value); });
  const riders = [...document.querySelectorAll('input[name="name"]')]
    .filter((i) => i.value.trim())
    .map((i) => ({ erg_id: i.dataset.erg, name: i.value.trim(), weight_kg: weights[i.dataset.erg] ?? null }));
  $("start").disabled = true;
  const res = await api("/api/session/start", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ preset_id: chosen.id, duration_min: Number($("duration").value) || null, riders }),
  });
  $("start").disabled = false;
  if (!res.ok) { $("error").textContent = (await res.json()).detail; return; }
  $("error").textContent = "";
  showRunning(true, "Starting… watch the screen!");
});

$("stop").addEventListener("click", async () => {
  if (!confirm("Stop the session now?")) return;
  await api("/api/session/stop", { method: "POST" });
  load();
});

// Follow the session so the page comes back to the form when it ends.
setInterval(async () => {
  const state = await (await api("/api/state")).json();
  const w = state.workout;
  if (!w && !$("running").hidden) { load(); return; }
  if (w) {
    const phase = { countdown: "Starting…", running: "Running", finished: "Showing results" }[w.phase];
    showRunning(true, `${w.preset}: ${phase}`);
  }
}, 2000);

load();
</script>
</body>
</html>
